<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Career Development Clinic - Poster</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #0f172a;
            font-family: 'Open Sans', 'Montserrat', sans-serif;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .display-viewport {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #dbe4f0;
            touch-action: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3vh 4vw;
        }

        .bg-holder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .poster-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand-navy {
            color: #1a3b8b;
        }
        .bg-brand-navy {
            background-color: #1a3b8b;
        }

        /* Shimmer Animation Keyframes */
        @keyframes shimmer {
            0% { transform: translateX(-150%) skewX(-20deg); }
            20% { transform: translateX(150%) skewX(-20deg); }
            100% { transform: translateX(150%) skewX(-20deg); }
        }

        /* Attention Pulse Keyframes for Next/Active Card */
        @keyframes attentionPulse {
            0% { box-shadow: 0 1vh 2.5vh rgba(0, 0, 0, 0.04), 0 0 0 0 rgba(16, 185, 129, 0.4); }
            50% { box-shadow: 0 1vh 2.5vh rgba(0, 0, 0, 0.04), 0 0 0 1.2vh rgba(16, 185, 129, 0.2); }
            100% { box-shadow: 0 1vh 2.5vh rgba(0, 0, 0, 0.04), 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Live Pulse Animation */
        @keyframes livePulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.75; transform: scale(1.04); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Fluid session card styling matching framework */
        .session-card {
            background-color: rgba(240, 245, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 1.5vh;
            position: relative;
            overflow: hidden;
            box-shadow: 0 1vh 2.5vh rgba(0, 0, 0, 0.04);
            padding: 1.4vh 2.5vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border 0.3s ease, box-shadow 0.3s ease;
        }

        .session-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            pointer-events: none;
            animation: shimmer 6s infinite ease-in-out;
            z-index: 4;
        }

        #session-card-0::after { animation-delay: 0s; }
        #session-card-1::after { animation-delay: 1.5s; }
        #session-card-2::after { animation-delay: 3s; }
        #session-card-3::after { animation-delay: 4.5s; }

        .session-card.today-card {
            border: 2px solid rgba(16, 185, 129, 0.8);
            animation: attentionPulse 3s infinite ease-in-out;
        }

        .badge-live-pulse {
            animation: livePulse 1.5s infinite ease-in-out;
        }

        .session-card-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .session-card-content {
            position: relative;
            z-index: 2;
        }

        .session-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 1.2vh;
            background-color: #1a3b8b;
            border-top-left-radius: 1.5vh;
            border-bottom-left-radius: 1.5vh;
            z-index: 3;
        }
    </style>
</head>
<body>

    <div class="display-viewport" id="viewport">
        <!-- Main Background Canvas -->
        <div class="bg-holder">
            <ambient-circles id="main-ambient"></ambient-circles>
        </div>

        <!-- App UI Layer -->
        <div id="poster-app" class="poster-content">
            <!-- Populated via script -->
        </div>
    </div>

    <script>
        /* TOUCH & CONTEXT LOCK */
        document.addEventListener('touchstart', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('touchend', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });

        /* DYNAMIC SCREEN LOCK */
        function lockScreenSize() {
            const viewport = document.getElementById('viewport');
            if (viewport) {
                const realHeight = window.innerHeight || document.documentElement.clientHeight;
                viewport.style.height = realHeight + 'px';
            }
        }

        window.addEventListener('resize', lockScreenSize);
        window.addEventListener('load', lockScreenSize);
        lockScreenSize();

        // Embedded Data Payload with Structured Date Parameters
        const signageData = {
          "display": {
            "backgroundColor": "#dbe4f0",
            "logoUrl": "Docs/IOM75logo.png",
            "circleCount": 48,
            "animationSpeed": 5.0
          },
          "announcement": {
            "badge": "CAREER DEVELOPMENT CLINIC",
            "titleLine1": "Boost Your Applications:",
            "titleLine2": "CVs & Motivation Letters",
            "sessions": [
              {
                "id": "s1",
                "date": "Tuesday, 10 Nov",
                "lang": "EN",
                "year": 2026, "month": 10, "day": 10,
                "startHour": 11, "startMin": 0,
                "endHour": 12, "endMin": 30,
                "time": "11:00 AM - 12:30 PM",
                "location": "Addis Ababa Time (EAT)",
                "qrCode": "Docs/Tomorrow at 11-00 AM .png"
              },
              {
                "id": "s2",
                "date": "Tuesday, 10 Nov",
                "lang": "EN",
                "year": 2026, "month": 10, "day": 10,
                "startHour": 18, "startMin": 0,
                "endHour": 19, "endMin": 30,
                "time": "6:00 PM - 7:30 PM",
                "location": "Addis Ababa Time (EAT)",
                "qrCode": "Docs/Tomorrow at 6-00 PM.png"
              },
              {
                "id": "s3",
                "date": "Thursday, 12 Nov",
                "lang": "FR",
                "year": 2026, "month": 10, "day": 12,
                "startHour": 14, "startMin": 0,
                "endHour": 15, "endMin": 30,
                "time": "2:00 PM - 3:30 PM",
                "location": "Addis Ababa Time (EAT)",
                "qrCode": "Docs/Thursday, November 12, 2-00 PM.png"
              },
              {
                "id": "s4",
                "date": "Thursday, 12 Nov",
                "lang": "ES",
                "year": 2026, "month": 10, "day": 12,
                "startHour": 18, "startMin": 0,
                "endHour": 19, "endMin": 30,
                "time": "6:00 PM - 7:30 PM",
                "location": "Addis Ababa Time (EAT)",
                "qrCode": "Docs/Thursday, November 12, 6-00 PM.png"
              }
            ],
            "footer": "Don't miss out on this valuable learning opportunity!"
          }
        };

        // Ambient Circles Web Component
        class AmbientCircles extends HTMLElement {
          constructor() {
            super();
            this.attachShadow({ mode: 'open' });
            this.shadowRoot.innerHTML = `
              <style>
                :host { display: block; width: 100%; height: 100%; background-color: var(--bg-color, transparent); }
                canvas { width: 100%; height: 100%; display: block; }
              </style>
              <canvas id="circleCanvas"></canvas>
            `;
            this.canvas = this.shadowRoot.getElementById('circleCanvas');
            this.ctx = this.canvas.getContext('2d');
            this.circles = [];
            this.speedMultiplier = 5.0;
          }

          init(config, customWidth = window.innerWidth, customHeight = window.innerHeight, isCard = false) {
            if (!this.canvas) return;
            this.canvas.width = customWidth;
            this.canvas.height = customHeight;

            if (config.backgroundColor && !isCard) {
              this.style.setProperty('--bg-color', config.backgroundColor);
            } else {
              this.style.setProperty('--bg-color', 'transparent');
            }
            this.speedMultiplier = config.animationSpeed || 5.0;

            const baseColors = isCard 
              ? [{ r: 180, g: 205, b: 245 }, { r: 210, g: 228, b: 255 }]
              : [{ r: 160, g: 190, b: 240 }, { r: 190, g: 215, b: 250 }];

            const count = config.circleCount || (isCard ? 54 : 48);
            this.circles = [];

            const cols = isCard ? 9 : 6;
            const rows = Math.ceil(count / cols);
            const cellW = customWidth / cols;
            const cellH = customHeight / rows;

            for (let i = 0; i < count; i++) {
              const selectedColor = baseColors[i % baseColors.length];
              const alpha = isCard ? (0.03 + Math.random() * 0.06).toFixed(2) : (0.06 + Math.random() * 0.12).toFixed(2);
              const minR = isCard ? 15 : (customWidth / 8);
              const maxR = isCard ? 50 : (customWidth / 4);

              const row = Math.floor(i / cols);
              const col = i % cols;
              const posX = (col * cellW) + (Math.random() * cellW);
              const posY = (row * cellH) + (Math.random() * cellH);

              this.circles.push({
                x: posX, y: posY,
                baseRadius: minR + Math.random() * (maxR - minR),
                radius: 0,
                color: `rgba(${selectedColor.r}, ${selectedColor.g}, ${selectedColor.b}, ${alpha})`,
                vx: (Math.random() - 0.5) * this.speedMultiplier,
                vy: (Math.random() - 0.5) * this.speedMultiplier,
                scaleAngle: Math.random() * Math.PI * 2,
                scaleSpeed: 0.01 + Math.random() * 0.02
              });
            }
            this.animate();
          }

          animate() {
            if (!this.ctx || !this.canvas) return;
            const w = this.canvas.width;
            const h = this.canvas.height;
            
            this.ctx.clearRect(0, 0, w, h);
            this.ctx.globalCompositeOperation = 'multiply';

            this.circles.forEach(c => {
              c.x += c.vx;
              c.y += c.vy;
              if (c.x < -100 || c.x > w + 100) c.vx *= -1;
              if (c.y < -100 || c.y > h + 100) c.vy *= -1;

              c.scaleAngle += c.scaleSpeed;
              c.radius = c.baseRadius * (0.8 + Math.sin(c.scaleAngle) * 0.2);

              this.ctx.beginPath();
              this.ctx.fillStyle = c.color;
              this.ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
              this.ctx.fill();
            });

            requestAnimationFrame(() => this.animate());
          }
        }
        if (!customElements.get('ambient-circles')) {
          customElements.define('ambient-circles', AmbientCircles);
        }

        function padZero(num) {
          return num < 10 ? '0' + num : num;
        }

        // Find the index of the next upcoming or currently live session
        function getNextSessionIndex() {
          const now = new Date();
          const sessions = signageData.announcement.sessions;
          for (let i = 0; i < sessions.length; i++) {
            const s = sessions[i];
            const targetEnd = new Date(s.year, s.month, s.day, s.endHour, s.endMin, 0);
            if (targetEnd - now > 0) {
              return i;
            }
          }
          return -1;
        }

        // Check if card frame should pulse (only for the single next/live session)
        function isCardActive(s, index) {
          const now = new Date();
          const targetEnd = new Date(s.year, s.month, s.day, s.endHour, s.endMin, 0);
          return (targetEnd - now > 0) && (index === getNextSessionIndex());
        }

        // Badge & Countdown logic: applies countdown ONLY to the next upcoming session
        function getSessionBadgeHTML(s, index) {
          const now = new Date();
          const targetStart = new Date(s.year, s.month, s.day, s.startHour, s.startMin, 0);
          const targetEnd = new Date(s.year, s.month, s.day, s.endHour, s.endMin, 0);

          const diffStart = targetStart - now;
          const diffEnd = targetEnd - now;
          const nextIdx = getNextSessionIndex();
          const isNextSession = (index === nextIdx);

          if (diffStart <= 0 && diffEnd > 0) {
            return `<span class="badge-live-pulse bg-orange-500 text-white font-black text-[1.3vh] px-2.5 py-0.5 rounded uppercase tracking-wider shadow-md inline-block my-0.5">● LIVE NOW</span>`;
          } else if (diffEnd <= 0) {
            return `<span class="bg-slate-600 text-slate-300 font-semibold text-[1.3vh] px-2.5 py-0.5 rounded uppercase tracking-wider inline-block my-0.5">Ended</span>`;
          } else if (isNextSession && diffStart > 0) {
            // Countdown timer ONLY for the single next upcoming session
            const hrs = Math.floor(diffStart / (1000 * 60 * 60));
            const mins = Math.floor((diffStart % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((diffStart % (1000 * 60)) / 1000);

            return `<div class="flex items-center space-x-2 my-0.5">
              <span class="bg-emerald-600 text-white font-extrabold text-[1.2vh] px-2 py-0.5 rounded uppercase tracking-wider shadow-sm shrink-0">Next Session</span>
              <span class="text-orange-500 font-extrabold text-[1.3vh] tracking-wide whitespace-nowrap">Starts in ${padZero(hrs)}h ${padZero(mins)}m ${padZero(secs)}s</span>
            </div>`;
          } else {
            const isToday = (now.getDate() === s.day && now.getMonth() === s.month && now.getFullYear() === s.year);
            if (isToday) {
              return `<span class="bg-emerald-600 text-white font-extrabold text-[1.3vh] px-2.5 py-0.5 rounded uppercase tracking-wider shadow-sm inline-block my-0.5">Today</span>`;
            } else {
              return `<span class="bg-slate-500 text-white font-bold text-[1.3vh] px-2.5 py-0.5 rounded uppercase tracking-wider shadow-sm inline-block my-0.5">Upcoming</span>`;
            }
          }
        }

        // Render Poster Content
        function renderSignage() {
          try {
            lockScreenSize();
            const data = signageData;
            
            const mainBg = document.getElementById('main-ambient');
            if (mainBg && data.display) {
              mainBg.init({ ...data.display, animationSpeed: 5.0 }, window.innerWidth, window.innerHeight, false);
            }

            const appContainer = document.getElementById('poster-app');
            const item = data.announcement;

            if (item && appContainer) {
              let sessionsHTML = item.sessions.map((s, index) => {
                const encodedQr = s.qrCode ? encodeURI(s.qrCode) : '';
                const qrContent = s.qrCode 
                  ? `<img src="${encodedQr}" alt="QR Code" class="w-full h-full object-contain p-1" onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\\'text-slate-700 font-semibold text-center text-[1.1vh]\\'>Scan QR</span>';">` 
                  : `<span class="text-slate-800 font-normal text-xl">QR code Here</span>`;

                const cardClass = isCardActive(s, index) ? "session-card today-card" : "session-card";

                return `
                  <div class="${cardClass}" id="session-card-${index}">
                      <div class="session-card-bg">
                          <ambient-circles class="card-ambient"></ambient-circles>
                      </div>
                      <div class="session-card-content flex flex-col justify-center pl-4">
                          <div class="flex items-center space-x-3 mb-1">
                              <h3 class="text-[2.2vh] font-extrabold text-slate-900 tracking-tight">
                                  ${s.date}
                              </h3>
                              <span class="bg-brand-navy text-amber-400 font-extrabold text-[1.5vh] px-3 py-1 rounded-lg tracking-wide shadow-sm">
                                  ${s.lang}
                              </span>
                          </div>
                          <div id="badge-container-${s.id}">
                              ${getSessionBadgeHTML(s, index)}
                          </div>
                          <p class="text-[1.6vh] text-slate-800 font-semibold mb-0.5 mt-0.5">
                              ${s.time}
                          </p>
                          <p class="text-[1.5vh] text-slate-700 font-medium">
                              ${s.location}
                          </p>
                      </div>

                      <div class="session-card-content flex flex-col items-center space-y-1 pr-1">
                          <div class="w-[9vh] h-[9vh] bg-white/95 rounded-xl flex items-center justify-center text-slate-800 shadow-sm border border-slate-300 overflow-hidden">
                              ${qrContent}
                          </div>
                          <span class="text-slate-700 text-[1.3vh] font-normal">Registration link</span>
                      </div>
                  </div>
                `;
              }).join('');

              const logoSectionHTML = data.display.logoUrl 
                ? `<img src="${encodeURI(data.display.logoUrl)}" class="h-[6vh] w-auto object-contain" alt="IOM Logo" onerror="this.onerror=null; this.outerHTML='<div class=\\'flex items-center space-x-2\\'><span class=\\'text-[2.5vh] font-extrabold brand-navy\\'>IOM</span></div>';">`
                : `<div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-2">
                        <div class="w-10 h-10 border-2 border-brand-navy rounded-full flex items-center justify-center p-1">
                            <svg class="w-full h-full fill-current brand-navy" viewBox="0 0 24 24">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                            </svg>
                        </div>
                        <div class="flex flex-col leading-none">
                            <span class="text-[2.5vh] font-extrabold brand-navy tracking-widest">IOM</span>
                            <span class="text-[1vh] font-bold brand-navy tracking-wider mt-0.5">UN MIGRATION</span>
                        </div>
                    </div>
                   </div>`;

              appContainer.innerHTML = `
                <div class="w-full flex flex-col">
                    <div class="w-full flex items-center justify-between mb-2">
                        <div class="bg-brand-navy px-6 py-2.5 w-[55%] shadow-sm">
                            <h1 class="text-white text-[1.6vh] font-bold tracking-wider uppercase font-sans">
                                ${item.badge}
                            </h1>
                        </div>
                        ${logoSectionHTML}
                    </div>

                    <div class="mb-2">
                        <h2 class="text-[2.3vh] font-semibold brand-navy tracking-tight mb-0.5">
                            ${item.titleLine1}
                        </h2>
                        <h1 class="text-[3.2vh] font-black brand-navy tracking-tight">
                            ${item.titleLine2}
                        </h1>
                    </div>

                    <div class="flex flex-col space-y-1.5">
                        ${sessionsHTML}
                    </div>
                </div>

                <div class="w-full flex justify-start pt-1">
                    <p class="text-[3.2vh] font-black brand-navy tracking-tight leading-tight uppercase max-w-[85%]">
                        ${item.footer}
                    </p>
                </div>
              `;

              setTimeout(() => {
                document.querySelectorAll('.session-card').forEach((card) => {
                  const cardAmbient = card.querySelector('.card-ambient');
                  if (cardAmbient && typeof cardAmbient.init === 'function') {
                    cardAmbient.init({
                      circleCount: 54,
                      animationSpeed: 5.0
                    }, card.offsetWidth, card.offsetHeight, true);
                  }
                });
              }, 50);
            }
          } catch (err) {
            console.error("Render error caught safely:", err);
          }
        }

        window.addEventListener('load', renderSignage);
        window.addEventListener('resize', renderSignage);
        renderSignage();

        // Real-time state ticker (updates countdown & badge states every second)
        setInterval(() => {
          try {
            signageData.announcement.sessions.forEach((s, idx) => {
              const badgeEl = document.getElementById(`badge-container-${s.id}`);
              if (badgeEl) {
                badgeEl.innerHTML = getSessionBadgeHTML(s, idx);
              }
              const cardEl = document.getElementById(`session-card-${idx}`);
              if (cardEl) {
                if (isCardActive(s, idx)) {
                  cardEl.classList.add("today-card");
                } else {
                  cardEl.classList.remove("today-card");
                }
              }
            });
          } catch (e) {}
        }, 1000);
    </script>
</body>
</html>
