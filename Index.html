<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Career Development Clinic - Poster</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Open+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #0f172a;
            font-family: 'Open Sans', 'Montserrat', sans-serif;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .display-viewport {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #dbe4f0;
            touch-action: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3.5vh 4vw;
        }

        .bg-holder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .poster-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand-navy {
            color: #1a3b8b;
        }
        .bg-brand-navy {
            background-color: #1a3b8b;
        }

        /* Shimmer Animation Keyframes */
        @keyframes shimmer {
            0% { transform: translateX(-150%) skewX(-20deg); }
            20% { transform: translateX(150%) skewX(-20deg); }
            100% { transform: translateX(150%) skewX(-20deg); }
        }

        /* Attention Pulse Keyframes for Today's Card */
        @keyframes attentionPulse {
            0% { box-shadow: 0 1vh 2.5vh rgba(0, 0, 0, 0.04), 0 0 0 0 rgba(16, 185, 129, 0.4); }
            50% { box-shadow: 0 1vh 2.5vh rgba(0, 0, 0, 0.04), 0 0 0 1.2vh rgba(16, 185, 129, 0.2); }
            100% { box-shadow: 0 1vh 2.5vh rgba(0, 0, 0, 0.04), 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Fluid session card styling with light shimmer sweep */
        .session-card {
            background-color: rgba(240, 245, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 1.5vh;
            position: relative;
            overflow: hidden;
            box-shadow: 0 1vh 2.5vh rgba(0, 0, 0, 0.04);
            padding: 1.6vh 2.5vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Light Shimmer Glare Overlay */
        .session-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                90deg, 
                transparent, 
                rgba(255, 255, 255, 0.4), 
                transparent
            );
            pointer-events: none;
            animation: shimmer 6s infinite ease-in-out;
            z-index: 4;
        }

        /* Stagger shimmer timing for each card so they don't sweep simultaneously */
        #session-card-0::after { animation-delay: 0s; }
        #session-card-1::after { animation-delay: 1.5s; }
        #session-card-2::after { animation-delay: 3s; }
        #session-card-3::after { animation-delay: 4.5s; }

        /* Today's card attention pulse state */
        .session-card.today-card {
            border: 2px solid rgba(16, 185, 129, 0.8);
            animation: attentionPulse 3s infinite ease-in-out;
        }

        .session-card-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .session-card-content {
            position: relative;
            z-index: 2;
        }

        .session-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 1.2vh;
            background-color: #1a3b8b;
            border-top-left-radius: 1.5vh;
            border-bottom-left-radius: 1.5vh;
            z-index: 3;
        }
    </style>
</head>
<body>

    <div class="display-viewport" id="viewport">
        <!-- Main Background Canvas -->
        <div class="bg-holder">
            <ambient-circles id="main-ambient"></ambient-circles>
        </div>

        <!-- App UI Layer -->
        <div id="poster-app" class="poster-content">
            <!-- Populated via script -->
        </div>
    </div>

    <script>
        /* TOUCH & CONTEXT LOCK */
        document.addEventListener('touchstart', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('touchend', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });

        /* DYNAMIC SCREEN LOCK */
        function lockScreenSize() {
            const viewport = document.getElementById('viewport');
            const realHeight = window.innerHeight || document.documentElement.clientHeight;
            viewport.style.height = realHeight + 'px';
        }

        window.addEventListener('resize', lockScreenSize);
        window.addEventListener('load', lockScreenSize);
        lockScreenSize();

        // Embedded Data Payload
        const signageData = {
          "display": {
            "backgroundColor": "#dbe4f0",
            "logoUrl": "Docs/IOM75logo.png",
            "circleCount": 48,
            "animationSpeed": 5.0
          },
          "announcement": {
            "badge": "CAREER DEVELOPMENT CLINIC",
            "titleLine1": "Boost Your Applications:",
            "titleLine2": "CVs & Motivation Letters",
            "sessions": [
              {
                "id": "s1",
                "date": "Tuesday, 10 Nov",
                "lang": "EN",
                "time": "11:00 AM - 12:30 PM",
                "location": "Addis Ababa Time (EAT)",
                "qrCode": "Docs/Tomorrow at 11-00 AM .png"
              },
              {
                "id": "s2",
                "date": "Tuesday, 10 Nov",
                "lang": "EN",
                "time": "6:00 PM - 7:30 PM",
                "location": "Addis Ababa Time (EAT)",
                "qrCode": "Docs/Tomorrow at 6-00 PM.png"
              },
              {
                "id": "s3",
                "date": "Thursday, 12 Nov",
                "lang": "FR",
                "time": "2:00 PM - 3:30 PM",
                "location": "Addis Ababa Time (EAT)",
                "qrCode": "Docs/Thursday, November 12, 2-00 PM.png"
              },
              {
                "id": "s4",
                "date": "Thursday, 12 Nov",
                "lang": "ES",
                "time": "6:00 PM - 7:30 PM",
                "location": "Addis Ababa Time (EAT)",
                "qrCode": "Docs/Thursday, November 12, 6-00 PM.png"
              }
            ],
            "footer": "Don't miss out on this valuable learning opportunity!"
          }
        };

        // Ambient Circles Web Component
        class AmbientCircles extends HTMLElement {
          constructor() {
            super();
            this.attachShadow({ mode: 'open' });
            this.shadowRoot.innerHTML = `
              <style>
                :host {
                  display: block;
                  width: 100%;
                  height: 100%;
                  background-color: var(--bg-color, transparent);
                }
                canvas {
                  width: 100%;
                  height: 100%;
                  display: block;
                }
              </style>
              <canvas id="circleCanvas"></canvas>
            `;
            this.canvas = this.shadowRoot.getElementById('circleCanvas');
            this.ctx = this.canvas.getContext('2d');
            this.circles = [];
            this.speedMultiplier = 5.0;
          }

          init(config, customWidth = window.innerWidth, customHeight = window.innerHeight, isCard = false) {
            this.canvas.width = customWidth;
            this.canvas.height = customHeight;

            if (config.backgroundColor && !isCard) {
              this.style.setProperty('--bg-color', config.backgroundColor);
            } else {
              this.style.setProperty('--bg-color', 'transparent');
            }
            this.speedMultiplier = config.animationSpeed || 5.0;

            const baseColors = isCard 
              ? [{ r: 180, g: 205, b: 245 }, { r: 210, g: 228, b: 255 }]
              : [{ r: 160, g: 190, b: 240 }, { r: 190, g: 215, b: 250 }];

            const count = config.circleCount || (isCard ? 54 : 48);
            this.circles = [];

            const cols = isCard ? 9 : 6;
            const rows = Math.ceil(count / cols);
            const cellW = customWidth / cols;
            const cellH = customHeight / rows;

            for (let i = 0; i < count; i++) {
              const selectedColor = baseColors[i % baseColors.length];
              const alpha = isCard ? (0.03 + Math.random() * 0.06).toFixed(2) : (0.06 + Math.random() * 0.12).toFixed(2);
              
              const minR = isCard ? 15 : (customWidth / 8);
              const maxR = isCard ? 50 : (customWidth / 4);

              const row = Math.floor(i / cols);
              const col = i % cols;
              const posX = (col * cellW) + (Math.random() * cellW);
              const posY = (row * cellH) + (Math.random() * cellH);

              this.circles.push({
                x: posX,
                y: posY,
                baseRadius: minR + Math.random() * (maxR - minR),
                radius: 0,
                color: `rgba(${selectedColor.r},${selectedColor.g}, ${selectedColor.b},${alpha})`,
                vx: (Math.random() - 0.5) * this.speedMultiplier,
                vy: (Math.random() - 0.5) * this.speedMultiplier,
                scaleAngle: Math.random() * Math.PI * 2,
                scaleSpeed: 0.01 + Math.random() * 0.02
              });
            }

            this.animate();
          }

          animate() {
            const w = this.canvas.width;
            const h = this.canvas.height;
            
            this.ctx.clearRect(0, 0, w, h);
            this.ctx.globalCompositeOperation = 'multiply';

            this.circles.forEach(c => {
              c.x += c.vx;
              c.y += c.vy;

              if (c.x < -100 || c.x > w + 100) c.vx *= -1;
              if (c.y < -100 || c.y > h + 100) c.vy *= -1;

              c.scaleAngle += c.scaleSpeed;
              c.radius = c.baseRadius * (0.8 + Math.sin(c.scaleAngle) * 0.2);

              this.ctx.beginPath();
              this.ctx.fillStyle = c.color;
              this.ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
              this.ctx.fill();
            });

            requestAnimationFrame(() => this.animate());
          }
        }
        customElements.define('ambient-circles', AmbientCircles);

        // Render Poster Content
        function renderSignage() {
          lockScreenSize();
          const data = signageData;
          
          const mainBg = document.getElementById('main-ambient');
          if (mainBg && data.display) {
            mainBg.init({ ...data.display, animationSpeed: 5.0 }, window.innerWidth, window.innerHeight, false);
          }

          const appContainer = document.getElementById('poster-app');
          const item = data.announcement;

          if (item && appContainer) {
            let sessionsHTML = item.sessions.map((s, index) => {
              const qrContent = s.qrCode 
                ? `<img src="${encodeURI(s.qrCode)}" alt="QR Code" class="w-full h-full object-contain p-1">` 
                : `<span class="text-slate-800 font-normal text-xl">QR code Here</span>`;

              const isToday = s.date.includes("10 Nov");
              const cardClass = isToday ? "session-card today-card" : "session-card";
              const statusBadge = isToday
                ? `<span class="bg-emerald-600 text-white font-extrabold text-[1.4vh] px-2.5 py-0.5 rounded-md uppercase tracking-wider shadow-sm">Today</span>`
                : `<span class="bg-slate-500 text-white font-bold text-[1.4vh] px-2.5 py-0.5 rounded-md uppercase tracking-wider shadow-sm">Upcoming</span>`;

              return `
                <div class="${cardClass}" id="session-card-${index}">
                    <div class="session-card-bg">
                        <ambient-circles class="card-ambient"></ambient-circles>
                    </div>
                    <div class="session-card-content flex flex-col justify-center pl-4">
                        <div class="flex items-center space-x-3 mb-1">
                            <h3 class="text-[2.3vh] font-extrabold text-slate-900 tracking-tight">
                                ${s.date}
                            </h3>
                            <span class="bg-brand-navy text-amber-400 font-extrabold text-[1.5vh] px-3 py-1 rounded-lg tracking-wide shadow-sm">
                                ${s.lang}
                            </span>
                        </div>
                        <div class="my-0.5">
                            ${statusBadge}
                        </div>
                        <p class="text-[1.7vh] text-slate-800 font
