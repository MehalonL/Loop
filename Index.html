<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signage Display</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 1080px;
      height: 1920px;
      background-color: #e6f0fa;
      color: #0033a0;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      position: relative;
      box-sizing: border-box;
      border: 16px solid #ffcc00;
    }

    .bg-holder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .overlay-content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 64px 44px;
      box-sizing: border-box;
    }

    .cards-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main-card {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 24px;
      padding: 48px;
      box-shadow: 0 20px 50px rgba(0, 51, 160, 0.15);
      width: 100%;
      box-sizing: border-box;
      border: 2px solid rgba(0, 51, 160, 0.1);
    }

    .badge {
      display: inline-block;
      background: #0033a0;
      color: #ffffff;
      padding: 8px 20px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 8px;
      margin-bottom: 24px;
      letter-spacing: 1px;
    }

    .card-title {
      font-size: 42px;
      margin: 0 0 20px 0;
      color: #0033a0;
      line-height: 1.2;
    }

    .card-desc {
      font-size: 24px;
      margin: 0 0 36px 0;
      color: #334155;
      line-height: 1.5;
    }

    .sessions-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 36px;
    }

    .session-row {
      background: #f0f5ff;
      border-left: 6px solid #4066b8;
      padding: 20px 24px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .session-date {
      font-size: 24px;
      font-weight: 700;
      color: #0033a0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .lang-tag {
      background: #4066b8;
      color: #fff;
      padding: 2px 10px;
      border-radius: 4px;
      font-size: 16px;
    }

    .session-times {
      display: flex;
      gap: 20px;
      font-size: 18px;
      color: #475569;
    }

    .card-footer {
      font-size: 22px;
      font-weight: 600;
      color: #0033a0;
      text-align: center;
      padding-top: 16px;
      border-top: 1px solid rgba(0, 51, 160, 0.1);
    }
  </style>
</head>
<body>

  <div class="bg-holder">
    <ambient-circles></ambient-circles>
  </div>

  <div class="overlay-content">
    <div id="cards-container" class="cards-wrapper"></div>
  </div>

  <script src="engine.js"></script>
</body>
</html>
