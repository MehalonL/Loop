<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Career Development Clinic - Poster</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Open+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #0f172a;
            font-family: 'Open Sans', 'Montserrat', sans-serif;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .display-viewport {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #dbe4f0;
            touch-action: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3.5vh 4vw;
        }

        .bg-holder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .poster-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand-navy {
            color: #1a3b8b;
        }
        .bg-brand-navy {
            background-color: #1a3b8b;
        }

        /* Shimmer Animation Keyframes */
        @keyframes shimmer {
            0% { transform: translateX(-150%) skewX(-20deg); }
            20% { transform: translateX(150%) skewX(-20deg); }
            100% { transform: translateX(150%) skewX(-20deg); }
        }

        /* Attention Pulse Keyframes for Active Cards */
        @keyframes attentionPulse {
            0% { box-shadow: 0 1vh 2.5vh rgba(0, 0, 0, 0.04), 0 0 0 0 rgba(16, 185, 129, 0.4); }
            50% { box-shadow: 0 1vh 2.5vh rgba(0, 0, 0, 0.04), 0 0 0 1.2vh rgba(16, 185, 129, 0.2); }
            100% { box-shadow: 0 1vh 2.5vh rgba(0, 0, 0, 0.04), 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Live Pulse Animation */
        @keyframes livePulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.75; transform: scale(1.04); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Fluid session card styling with light shimmer sweep */
        .session-card {
            background-color: rgba(240, 245, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 1.5vh;
            position: relative;
            overflow: hidden;
            box-shadow: 0 1vh 2.5vh rgba(0, 0, 0, 0.04);
            padding: 1.6vh 2.5vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border 0.3s ease, box-shadow 0.3s ease;
        }

        /* Light Shimmer Glare Overlay */
        .session-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                90deg, 
                transparent, 
                rgba(255, 255, 255, 0.4), 
                transparent
            );
            pointer-events: none;
            animation: shimmer 6s infinite ease-in-out;
            z-index: 4;
        }

        #session-card-0::after { animation-delay: 0s; }
        #session-card-1::after { animation-delay: 1.5s; }
        #session-card-2::after { animation-delay: 3s; }
        #session-card-3::after { animation-delay: 4.5s; }

        /* Today's active card pulse state */
        .session-card.today-card {
            border: 2px solid rgba(16, 185, 129, 0.8);
            animation: attentionPulse 3s infinite ease-in-out;
        }

        .badge-live-pulse {
            animation: livePulse 1.5s infinite ease-in-out;
        }

        .session-card-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .session-card-content {
            position: relative;
            z-index: 2;
        }

        .session-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 1.2vh;
            background-color: #1a3b8b;
            border-top-left-radius: 1.5vh;
            border-bottom-left-radius: 1.5vh;
            z-index: 3;
        }
    </style>
</head>
